name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          # Hosted macOS arm64 queues can expire before acquiring a runner.
          - os: macos-15-intel
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s tests -v
      - run: python benchmarks/run.py
      - name: Plan real evaluation without inference
        run: python evaluation/real.py > real-evaluation-plan.json
      - name: Fixed evaluation corpus and latency gates
        run: python evaluation/run.py --output evaluation-ci.json
      - name: Installed entry point outside source directory
        run: |
          cd "$(mktemp -d)"
          python "$GITHUB_WORKSPACE/tests/installed_smoke.py" "$(mktemp -d)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            dist/*.whl
            evaluation-ci.json
            real-evaluation-plan.json
