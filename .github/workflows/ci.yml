name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          # Hosted macOS arm64 queues can expire before acquiring a runner.
          - os: macos-15-intel
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --no-deps .
      - run: python -m unittest discover -s tests -v
      - run: python benchmarks/run.py
      - name: Installed entry point outside source directory
        run: |
          cd "$(mktemp -d)"
          ctr classify 'Fix typo in README.md' --json
